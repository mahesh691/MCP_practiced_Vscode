name: Playwright Tests

on:
  # Run on push to main/master
  push:
    branches:
      - main
      - master

  # Run on pull requests targeting main/master
  pull_request:
    branches:
      - main
      - master

  # Allow manual execution with tag selection
  workflow_dispatch:
    inputs:
      tag:
        description: 'Enter Playwright tag (example: @checkOutFlow)'
        required: true
        default: '@checkOutFlow'
        type: string

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install npm dependencies
      - name: Install dependencies
        run: npm ci

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Run Playwright tests
      - name: Run Playwright tests
        shell: bash
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running tests with tag: ${{ inputs.tag }}"
            npx playwright test --grep "${{ inputs.tag }}"
          else
            echo "Running checkout flow tests"
            npx playwright test --grep "@checkOutFlow"
          fi

      # Upload HTML report
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      # Upload screenshots, videos and traces
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 3
